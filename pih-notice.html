<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>PIH</title>
    <style>
      html, body {
        margin: 0;
        background: #0e0e10;
        color: #efeff1;
        font: 14px/1.4 "Segoe UI", sans-serif;
      }
      .card { padding: 16px; }
      h1 { margin: 0 0 6px; font-size: 16px; }
      p { margin: 0 0 14px; color: #adadb8; }
      button {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      .go { background: #9147ff; color: #fff; }
      .close { margin-left: 8px; background: #3a3a3d; color: #efeff1; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PIH</h1>
      <p>Трансляция началась</p>
      <button type="button" class="go" id="go">Открыть</button>
      <button type="button" class="close" id="close">Закрыть</button>
    </div>
    <script src="pih-notice.js"></script>
  </body>
</html>
